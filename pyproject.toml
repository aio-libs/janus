[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "janus"
dynamic = ["version"]
description = "Mixed sync-async queue to interoperate between asyncio tasks and classic threads"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Svetlov", email = "andrew.svetlov@gmail.com" }]
requires-python = ">=3.11"
keywords = ["janus", "queue", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
"Chat: Gitter" = "https://gitter.im/aio-libs/Lobby"
"CI: GitHub Actions" = "https://github.com/aio-libs/janus/actions/workflows/ci.yml"
"Coverage: codecov" = "https://codecov.io/github/aio-libs/janus"
"GitHub: issues" = "https://github.com/aio-libs/janus/issues"
"GitHub: repo" = "https://github.com/aio-libs/janus"

[dependency-groups]
dev = [
    "coverage==7.17.3",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-codspeed==5.0.4",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[tool.hatch.version]
path = "janus/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/janus",
    "/tests",
    "/CHANGES.rst",
    "/README.rst",
    "/LICENSE",
    "/Makefile",
]

[tool.hatch.build.targets.wheel]
packages = ["janus"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["janus"]

[tool.pytest.ini_options]
addopts = "--cov-branch --cov-report xml"
log_cli = false
log_level = "INFO"
junit_family = "xunit2"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # pytest-asyncio 0.24.0 does't close the event loop for some reason
    # it is the source of unclosed loop and socket warnings
    "ignore:unclosed event loop:ResourceWarning",
    "ignore:unclosed <socket.socket.+>:ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["janus", "tests"]
omit = ["site-packages"]

[tool.coverage.html]
directory = "coverage"
