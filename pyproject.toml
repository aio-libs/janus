[build-system]
requires = ["setuptools>=82.0.1", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[tool.towncrier]
package = "janus"
filename = "CHANGES.rst"
directory = "CHANGES/"
title_format = "{version} ({project_date})"
underlines = ["-", "~", "^"]
issue_format = "`#{issue} <https://github.com/aio-libs/janus/issues/{issue}>`_"
